<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Python Übungen</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>"
    />
    <style>
      :root {
        --bg: #0b0d14;
        --card: #161925;
        --card2: #1c2030;
        --border: #2a2f42;
        --text: #e8eaf2;
        --muted: #a0a6bd;
        --accent: #ffd43b;
        --accent2: #4b8bbe;
        --ok: #3ecf8e;
        --err: #ef5a5a;
        --mono: "Consolas", "Menlo", monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        background:
          radial-gradient(
            ellipse at top left,
            rgba(75, 139, 190, 0.18),
            transparent 55%
          ),
          radial-gradient(
            ellipse at top right,
            rgba(255, 212, 59, 0.1),
            transparent 50%
          ),
          var(--bg);
        background-attachment: fixed;
        color: var(--text);
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem 1.2rem 5rem;
        line-height: 1.5;
      }
      header {
        background: linear-gradient(135deg, var(--card2), var(--card));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.6rem 1.8rem;
        margin-bottom: 2rem;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 0.3rem;
        letter-spacing: -0.01em;
      }
      h1 .dot1 {
        color: var(--accent2);
      }
      h1 .dot2 {
        color: var(--accent);
      }
      #status {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 1rem;
      }
      .fortschritt {
        display: flex;
        align-items: center;
        gap: 0.9rem;
      }
      .balken-bg {
        flex: 1;
        height: 10px;
        background: #0b0d14;
        border: 1px solid var(--border);
        border-radius: 99px;
        overflow: hidden;
      }
      #balken {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent2), var(--ok));
        border-radius: 99px;
        transition: width 0.4s ease;
      }
      #zaehler {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
        white-space: nowrap;
      }
      .kapitel {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        font-size: 1.25rem;
        margin: 2.4rem 0 1.1rem;
        color: var(--accent);
      }
      .kapitel::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--border), transparent);
      }
      .aufgabe {
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 4px solid var(--accent2);
        border-radius: 14px;
        padding: 1.4rem 1.6rem 1.5rem;
        margin-bottom: 1.4rem;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
        transition:
          border-color 0.25s,
          transform 0.2s;
      }
      .aufgabe:hover {
        transform: translateY(-1px);
      }
      .aufgabe.geloest {
        border-left-color: var(--ok);
      }
      .kopf {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        margin-bottom: 0.9rem;
      }
      .badge {
        flex: none;
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--accent2);
        color: #0b0d14;
        font-weight: 700;
        font-size: 0.95rem;
      }
      .geloest .badge {
        background: var(--ok);
      }
      h2 {
        flex: 1;
        font-size: 1.15rem;
        margin: 0;
      }
      .haken {
        display: none;
        color: var(--ok);
        font-weight: 700;
        font-size: 1.2rem;
      }
      .geloest .haken {
        display: block;
      }
      .erklaerung {
        background: #11141f;
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 1rem;
      }
      .aufgabetext {
        margin: 0 0 0.9rem;
      }
      textarea,
      .codeblock {
        width: 100%;
        font-family: var(--mono);
        font-size: 14px;
        background: #0a0c12;
        color: #e8eaf2;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.9rem 1rem;
        line-height: 1.55;
      }
      textarea {
        resize: vertical;
        tab-size: 4;
      }
      textarea:focus,
      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent2);
        box-shadow: 0 0 0 3px rgba(75, 139, 190, 0.25);
      }
      .codeblock {
        margin: 0 0 1rem;
        white-space: pre;
        overflow-x: auto;
      }
      .felder {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 0.6rem;
        margin-bottom: 0.9rem;
      }
      .feld {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        background: #11141f;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.45rem 0.7rem;
      }
      .feld.richtig {
        border-color: var(--ok);
      }
      .feld.falsch {
        border-color: var(--err);
      }
      .feld-label {
        font-family: var(--mono);
        font-size: 13.5px;
        flex: 1;
        white-space: nowrap;
      }
      input[type="text"] {
        width: 110px;
        font-family: var(--mono);
        font-size: 14px;
        background: #0a0c12;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.35rem 0.55rem;
      }
      button {
        background: linear-gradient(135deg, var(--accent2), #3a73a0);
        color: #fff;
        border: none;
        padding: 0.65rem 1.3rem;
        border-radius: 9px;
        cursor: pointer;
        margin-top: 0.8rem;
        font-weight: 600;
        font-size: 0.92rem;
        box-shadow: 0 3px 10px rgba(75, 139, 190, 0.3);
        transition:
          transform 0.15s,
          opacity 0.15s;
      }
      button:hover {
        transform: translateY(-1px);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
        transform: none;
      }
      .tipp {
        font-size: 0.78rem;
        color: var(--muted);
        margin: 0.5rem 0 0;
      }
      pre.ausgabe {
        background: #0a0c12;
        border: 1px solid var(--border);
        padding: 0.8rem 1rem;
        border-radius: 10px;
        white-space: pre-wrap;
        font-family: var(--mono);
        font-size: 13.5px;
        margin: 0.7rem 0 0;
      }
      pre.ausgabe:empty {
        display: none;
      }
      .res {
        margin: 0.8rem 0 0;
        font-weight: 600;
      }
      .res.ok {
        color: var(--ok);
      }
      .res.falsch {
        color: var(--err);
      }
      .auswahl-liste {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        margin-bottom: 0.9rem;
      }
      .auswahl-zeile {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        background: #11141f;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 0.55rem 0.9rem;
        flex-wrap: wrap;
      }
      .auswahl-zeile.richtig {
        border-color: var(--ok);
      }
      .auswahl-zeile.falsch {
        border-color: var(--err);
      }
      .auswahl-name {
        font-family: var(--mono);
        font-size: 14px;
      }
      .auswahl-optionen {
        display: flex;
        gap: 0.5rem;
      }
      .auswahl-optionen label {
        position: relative;
        display: block;
        padding: 0.3rem 0.95rem;
        border: 1px solid var(--border);
        border-radius: 99px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        color: var(--muted);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .auswahl-optionen label:hover {
        border-color: var(--accent2);
      }
      .auswahl-optionen input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .auswahl-optionen label:has(input:checked) {
        background: var(--accent2);
        border-color: var(--accent2);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>
        <span class="dot1">&lt;</span>Python Übungen<span class="dot2"
          >&gt;</span
        >
      </h1>
      <p id="status">Python wird geladen …</p>
      <div class="fortschritt">
        <div class="balken-bg"><div id="balken"></div></div>
        <span id="zaehler">0 von 0 gelöst</span>
      </div>
    </header>
    <div id="aufgaben"></div>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
    <script src="app.js"></script>
  </body>
</html>
